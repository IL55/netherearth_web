[project]
repo_url = "https://github.com/IL55/netherearth_web"
repo_name = "IL55/netherearth_web"
edit_uri = "edit/main/docs/"

site_name = "NetherEarth Web Documentation"
site_description = "NetherEarth Web — browser-based 3D strategy game"
site_author = "@IL55"
site_url = "https://IL55.github.io/netherearth_web/"

copyright = """
Copyright &copy; 2026 Igor Lobiv
"""

nav = [
  { "NetherEarth Web" = "index.md" },
  { "Reference" = [
    "reference/adr-index.md",
  ] },
  { "Explanation" = [
    { "Architecture" = [
      "explanation/architecture/architecture-overview.md",
      { "ADRs" = [
        "explanation/architecture/adrs/0001-record-architecture-decisions.md",
      ] },
    ] },
  ] },
  { "How-To Guides" = "how-to-guides/index.md" },
  { "Tutorials" = "tutorials/index.md" },
]

extra_css = ["assets/extra.css"]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.prune",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/gamepad-2"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.status]]
done = "Done"
in-progress = "In progress"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/IL55/netherearth_web"
name = "IL55/netherearth_web"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.snippets]
auto_append = ["docs/includes/abbreviations.md", "docs/includes/footer.md"]
